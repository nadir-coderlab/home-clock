<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>ساعة البيت</title>
<script src="$WEBAPIS/webapis/webapis.js"></script>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<iframe id="f"></iframe>
<script>
// غلاف التطبيق على شاشة سامسونج: يفتح التصميم من الإنترنت (عشان التحديثات توصل عن بعد)،
// وإذا ما فيه نت يفتح النسخة اللي داخل التطبيق. ويمنع الشاشة من الانطفاء أو شاشة التوقف.
var REMOTE = 'https://nadir-coderlab.github.io/home-clock/?city=madinah';
var LOCAL = 'web/index.html?city=madinah';
var f = document.getElementById('f');
fetch('https://nadir-coderlab.github.io/home-clock/holidays.json', { cache: 'no-store' })
  .then(function (r) { f.src = r.ok ? REMOTE : LOCAL; })
  .catch(function () { f.src = LOCAL; });
// لو انقطع النت بعدين ورجع، نجرب الرابط كل ساعة
setInterval(function () { if (f.src.indexOf('http') !== 0) fetch(REMOTE, { cache: 'no-store' }).then(function (r) { if (r.ok) f.src = REMOTE; }); }, 3600000);
try { webapis.appcommon.setScreenSaver(webapis.appcommon.AppCommonScreenSaverState.SCREEN_SAVER_OFF); } catch (e) {}
try { tizen.power.request('SCREEN', 'SCREEN_NORMAL'); } catch (e) {}
// زر الرجوع يقفل التطبيق
document.addEventListener('keydown', function (e) {
  if (e.keyCode === 10009) { try { tizen.application.getCurrentApplication().exit(); } catch (x) {} }
});
</script>
</body>
</html>
